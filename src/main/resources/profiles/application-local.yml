manage-orders:
  environment: local

spring:
  datasource:
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/manage-orders
  jpa:
    properties:
      hibernate:
        default_schema: manage-orders
        show_sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      topic: topic-orders
      group-id: manage-orders
      retries: 5
      retry-backoff-ms: 2000
  liquibase:
    enabled: true
    changelog: config/liquibase/master.xml
    schema: manage-orders

logging:
  level:
    root: INFO

server:
  port: 8081
  servlet:
    context-path: /manage-orders
