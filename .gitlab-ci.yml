stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  before_script:
    - export JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk-25.jdk/Contents/Home
    - export PATH="$JAVA_HOME/bin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    - echo "JAVA_HOME=$JAVA_HOME"
    - ls -ld "$JAVA_HOME"
    - ls -l "$JAVA_HOME/bin"
    - ls -l "$JAVA_HOME/bin/java"
    - $JAVA_HOME/bin/java -version
    - which java
    - java -version
    - ./mvnw -version
  script:
    - echo "---🔨Build immagine Docker ---"
    - ./mvnw clean package -DskipTests
    - docker build -t manage-orders-app:latest .
    - docker tag manage-orders-app:latest antoniobasileo/manage-orders-app:latest
    - docker push antoniobasileo/manage-orders-app:latest
    - echo "---✅ Immagine docker pushata su Docker Hub (antoniobasileo/manage-orders-app:latest) ---"

deploy:
  stage: deploy
  script:
    - echo "-- 🏗️️ Deploy su Kubernetes ---"
    - kubectl config use-context docker-desktop
    - cd ../kube-config
    - ./scripts/apply.sh manage-orders general
